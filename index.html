<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Curation — yjun0915</title>
<meta name="description" content="최신 학술 논문 자동 큐레이션 · VQSD · HD Certification">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
  :root {
    --vqsd-color: #7C3AED;
    --hdcert-color: #0891B2;
    --text-primary: #1a1a1a;
    --text-secondary: #555;
    --text-tertiary: #888;
    --bg: #fafafa;
    --card-bg: #ffffff;
    --border: #e5e5e5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 4rem 2rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header { text-align: center; margin-bottom: 4rem; }

  h1 {
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 1rem;
    background: linear-gradient(135deg, #7C3AED, #0891B2);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 1.1rem;
    color: var(--text-secondary);
    max-width: 560px;
    margin: 0 auto;
  }

  .author {
    margin-top: 1.25rem;
    font-size: 0.9rem;
    color: var(--text-tertiary);
  }

  .author a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }

  .author a:hover { border-bottom-color: var(--text-secondary); }

  main { flex: 1; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1.5rem;
    margin-bottom: 4rem;
  }

  .card {
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.25rem 2rem;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--accent, var(--text-primary));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
    border-color: var(--accent);
  }

  .card:hover::before { transform: scaleX(1); }

  .card-vqsd { --accent: #7C3AED; }
  .card-hdcert { --accent: #0891B2; }

  .card-label {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 0.35rem 0.75rem;
    border: 1px solid currentColor;
    border-radius: 999px;
    margin-bottom: 1.25rem;
  }

  .card-title {
    font-size: 1.625rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.75rem;
    color: var(--text-primary);
  }

  .card-ko {
    font-size: 0.95rem;
    color: var(--text-secondary);
    margin-bottom: 1.25rem;
  }

  .card-desc {
    font-size: 0.95rem;
    color: var(--text-secondary);
    line-height: 1.65;
    margin-bottom: 1.75rem;
  }

  .card-cta {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent);
  }

  .card-cta svg { transition: transform 0.2s ease; }
  .card:hover .card-cta svg { transform: translateX(4px); }

  footer {
    text-align: center;
    padding-top: 2rem;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--text-tertiary);
  }

  footer a {
    color: var(--text-secondary);
    text-decoration: none;
    margin: 0 0.5rem;
    transition: color 0.2s;
  }

  footer a:hover { color: #7C3AED; }

  .footer-separator { color: var(--border); margin: 0 0.25rem; }

  @media (max-width: 640px) {
    .container { padding: 2.5rem 1.25rem; }
    header { margin-bottom: 2.5rem; }
    .cards { margin-bottom: 2.5rem; }
    .card { padding: 1.75rem 1.5rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Paper Curation</h1>
    <p class="subtitle">지식공간 여행자를 위한 항해지도</p>
    <p class="author">by <a href="https://github.com/yjun0915" target="_blank" rel="noopener">yjun0915</a> · KIST</p>
  </header>

  <main>
    <div class="cards">
      <a href="./vqsd/" class="card card-vqsd">
        <span class="card-label">Quantum Computing</span>
        <h2 class="card-title">VQSD · 22편</h2>
        <p class="card-ko">양자 상태 판별</p>
        <p class="card-desc">변분 양자 고유값 분해(VQSD) 및 양자 상태 판별 알고리즘 최신 논문 큐레이션.</p>
        <span class="card-cta">카테고리 보기 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></span>
      </a>
      <a href="./hdcert/" class="card card-hdcert">
        <span class="card-label">Quantum Devices</span>
        <h2 class="card-title">HD Certification · 18편</h2>
        <p class="card-ko">고차원 양자 인증</p>
        <p class="card-desc">고차원 양자 장치의 강건한 인증 및 벤치마킹 최신 논문 큐레이션.</p>
        <span class="card-cta">카테고리 보기 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></span>
      </a>
    </div>
  </main>

  <footer>
    <a href="https://github.com/yjun0915/paper-curation" target="_blank" rel="noopener">GitHub</a>
    <span class="footer-separator">·</span>
    <span>Powered by Claude Code</span>
  </footer>
</div>
</body>
</html>
